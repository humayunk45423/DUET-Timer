<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>DUET Admission</title>
<script>
(function(){
    var t = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', t);
})();
</script>
<style>
/* ── VARIABLES ── */
:root {
    --bg:       #020203;
    --panel:    rgba(255,255,255,0.045);
    --border:   rgba(255,255,255,0.09);
    --accent:   #00e5ff;
    --slash:    #ff0055;
    --fg:       #ffffff;
    --muted:    #888888;
    --cal-bg:   #000000;
    --glow:     radial-gradient(ellipse 80% 40% at 50% 0%, rgba(0,229,255,0.12) 0%, transparent 70%);
}
[data-theme="light"] {
    --bg:       #eef1f5;
    --panel:    rgba(255,255,255,0.75);
    --border:   rgba(0,0,0,0.07);
    --accent:   #0097b2;
    --slash:    #e8004d;
    --fg:       #0d0d0d;
    --muted:    #666666;
    --cal-bg:   #e2e5eb;
    --glow:     radial-gradient(ellipse 80% 40% at 50% 0%, rgba(0,151,178,0.1) 0%, transparent 70%);
}

/* ── RESET ── */
*,*::before,*::after {
    box-sizing: border-box;
    margin: 0; padding: 0;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    /* NO transitions here — that was the lag source */
}

html, body {
    height: 100%;
    overscroll-behavior: none;
}

body {
    background: var(--bg);
    color: var(--fg);
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
    transform: translateZ(0);
    -webkit-transform: translateZ(0);
}

::-webkit-scrollbar { display: none; }

/* App shell — full height container */
#app-shell {
    width: 100%;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
}

/* Mobile: top-left/right stack vertically inside top-half */
.top-left, .top-right {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
}

/* ══════════════════════════════════════
   THE OVERLAY — this is the magic.
   Instead of transitioning 200+ elements,
   we fade ONE overlay div over the screen.
   Theme switches instantly underneath.
   Result: silky, zero-lag, professional.
══════════════════════════════════════ */
#theme-overlay {
    position: fixed;
    inset: 0;
    z-index: 9999;
    pointer-events: none;
    opacity: 0;
    /* transform-only animation = GPU composited, zero paint */
    transition: opacity 220ms cubic-bezier(0.4, 0, 0.2, 1);
    will-change: opacity;
}

/* ── HEADER ── */
header {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: calc(env(safe-area-inset-top, 12px) + 14px) 20px 10px;
    z-index: 100;
}

.app-title {
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--accent);
}

/* ── TOGGLE ── */
.theme-toggle {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: var(--panel);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    /* Only animate transform — compositor thread, zero jank */
    transition: transform 180ms cubic-bezier(0.34,1.56,0.64,1);
    will-change: transform;
}
.theme-toggle:active { transform: scale(0.80); }

.toggle-icon {
    position: absolute;
    display: flex; align-items: center; justify-content: center;
    /* opacity+transform only = GPU composited */
    transition:
        opacity 250ms cubic-bezier(0.4,0,0.2,1),
        transform 300ms cubic-bezier(0.34,1.56,0.64,1);
    will-change: opacity, transform;
}
.toggle-icon.hidden  { opacity: 0; transform: scale(0.3) rotate(120deg); pointer-events: none; }
.toggle-icon.visible { opacity: 1; transform: scale(1)   rotate(0deg); }
.toggle-icon svg { stroke: var(--fg); display: block; }

/* ── TOP HALF ── */
#top-half {
    flex: 0 0 52%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: calc(env(safe-area-inset-top, 12px) + 52px) 18px 18px;
    position: relative;
    z-index: 1;
    border-bottom: 1px solid var(--border);
    background: var(--bg) var(--glow);
}

.top-left  { margin-bottom: 8px; }
.top-right { }

.section-lbl {
    font-size: 9.5px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 3px;
    margin-bottom: 14px;
}

/* ── BENTO ── */
.bento-grid {
    display: grid;
    grid-template-columns: repeat(6,1fr);
    gap: 7px;
    width: 100%;
    max-width: 420px;
    margin-bottom: 18px;
}

.bento-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 13px;
    padding: 11px 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    /* Only transform for press — compositor thread */
    transition: transform 140ms cubic-bezier(0.34,1.56,0.64,1);
    will-change: transform;
}
.bento-card:active { transform: scale(0.91); }

.b-val {
    font-size: 19px;
    font-weight: 900;
    color: var(--fg);
    font-variant-numeric: tabular-nums;
    will-change: transform, opacity;
}
.b-val.tick { animation: tick 110ms cubic-bezier(0.25,0.46,0.45,0.94) both; }
@keyframes tick {
    from { transform: translateY(-5px); opacity: 0.3; }
    to   { transform: translateY(0);    opacity: 1; }
}

.b-lbl {
    font-size: 7.5px;
    font-weight: 800;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 4px;
}

/* ── TOTALS ── */
.totals-container {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 7px;
}
.tot-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 14px;
    border-radius: 9px;
    border-left: 2px solid var(--accent);
    background: var(--panel);
}
.tot-lbl {
    font-size: 9.5px;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 2px;
}
.tot-val {
    font-size: 15px;
    font-weight: 900;
    color: var(--fg);
    font-variant-numeric: tabular-nums;
}

/* ── CALENDAR ── */
#bottom-half {
    flex: 1;
    overflow-y: auto;
    padding: 0 18px 40px;
    background: var(--cal-bg);
    -webkit-overflow-scrolling: touch;
    /* Compositor layer for scroll */
    transform: translateZ(0);
    -webkit-transform: translateZ(0);
    will-change: scroll-position;
}

.month-block { margin-top: 22px; }

.month-title {
    font-size: 14px;
    font-weight: 800;
    color: var(--fg);
    margin-bottom: 10px;
    position: sticky;
    top: 0;
    background: var(--cal-bg);
    padding: 14px 0 9px;
    z-index: 10;
    letter-spacing: 2px;
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
}

.calendar-grid {
    display: grid;
    grid-template-columns: repeat(7,1fr);
    gap: 7px;
}
.day-header {
    font-size: 9px;
    color: var(--muted);
    text-align: center;
    font-weight: 800;
    margin-bottom: 4px;
}
.day {
    position: relative;
    aspect-ratio: 1;
    border-radius: 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    transition: transform 130ms cubic-bezier(0.34,1.56,0.64,1);
    will-change: transform;
}
.day:active { transform: scale(0.88); }

.cal-date {
    position: absolute;
    top: 3px; left: 5px;
    font-size: 8.5px;
    color: var(--muted);
    font-weight: 700;
}
.cal-left {
    font-size: 14px;
    font-weight: 900;
    color: var(--fg);
}

.day.crossed {
    background: transparent !important;
    border-color: transparent !important;
    opacity: 0.4;
}
.day.crossed .cal-left { color: var(--muted); }
.day.crossed::after {
    content: '';
    position: absolute;
    width: 140%; height: 2px;
    background: var(--slash);
    transform: rotate(-45deg);
    border-radius: 3px;
}
.day.today {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent) inset;
}
.day.today .cal-left { color: var(--accent); }

.day.target {
    background: var(--accent) !important;
    border: none;
}
.day.target .cal-left,
.day.target .cal-date { color: #000 !important; font-weight: 900; }

/* ── ENTRANCE ANIMATIONS ── */
@keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
}
.bento-grid       { animation: fadeUp 480ms cubic-bezier(0.25,0.46,0.45,0.94) 60ms  both; }
.totals-container { animation: fadeUp 480ms cubic-bezier(0.25,0.46,0.45,0.94) 160ms both; }
#bottom-half      { animation: fadeUp 380ms cubic-bezier(0.25,0.46,0.45,0.94) 240ms both; }

/* ══════════════════════════════════════
   DESKTOP RESPONSIVE
   On wide screens: side-by-side layout,
   bigger fonts, constrained max-width,
   centered card feel like a real app.
══════════════════════════════════════ */
@media (min-width: 700px) {
    body {
        align-items: center;
        justify-content: center;
        background: var(--bg);
    }

    /* Centered app card on desktop */
    #app-shell {
        width: 100%;
        max-width: 1100px;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        position: relative;
    }

    header {
        position: relative;
        padding: 28px 36px 0;
    }

    .app-title { font-size: 15px; letter-spacing: 3px; }

    .theme-toggle { width: 42px; height: 42px; }

    /* Top half: side by side on desktop */
    #top-half {
        flex: 0 0 auto;
        flex-direction: row;
        align-items: stretch;
        justify-content: center;
        padding: 32px 36px 28px;
        gap: 36px;
        min-height: 260px;
    }

    .top-left, .top-right {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        max-width: 520px;
    }

    .bento-grid {
        max-width: 100%;
        gap: 10px;
    }

    .bento-card { border-radius: 16px; padding: 16px 0; }

    .b-val  { font-size: 26px; }
    .b-lbl  { font-size: 9px; margin-top: 6px; }

    .totals-container { gap: 9px; max-width: 100%; }
    .tot-row  { padding: 11px 18px; border-radius: 11px; }
    .tot-lbl  { font-size: 11px; }
    .tot-val  { font-size: 18px; }

    .section-lbl { font-size: 11px; margin-bottom: 18px; }

    /* Calendar: 2 columns side by side */
    #bottom-half {
        flex: 1;
        padding: 0 36px 40px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        align-content: start;
        column-gap: 36px;
        overflow-y: auto;
    }

    .month-block { margin-top: 28px; }
    .month-title { font-size: 16px; padding: 16px 0 10px; }
    .calendar-grid { gap: 9px; }
    .cal-date { font-size: 10px; top: 4px; left: 6px; }
    .cal-left { font-size: 16px; }
    .day-header { font-size: 11px; }
    .day { border-radius: 12px; }
}

@media (min-width: 1100px) {
    #bottom-half {
        grid-template-columns: 1fr 1fr 1fr;
        column-gap: 40px;
    }
    #top-half { padding: 36px 60px 32px; gap: 60px; }
    header { padding: 32px 60px 0; }
    #bottom-half { padding: 0 60px 50px; }
}
</style>
</head>
<body>

<!-- THE OVERLAY — single composited layer for theme transition -->
<div id="theme-overlay"></div>

<div id="app-shell">

<header>
    <div class="app-title">DUET Admission</div>
    <div class="theme-toggle" id="theme-btn" onclick="toggleTheme()">
        <span class="toggle-icon" id="icon-sun">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="5"/>
                <line x1="12" y1="1"  x2="12" y2="3"/>   <line x1="12" y1="21" x2="12" y2="23"/>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/> <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                <line x1="1" y1="12" x2="3" y2="12"/>    <line x1="21" y1="12" x2="23" y2="12"/>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/> <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
        </span>
        <span class="toggle-icon" id="icon-moon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
        </span>
    </div>
</header>

<div id="top-half">
    <div class="top-left">
        <div class="section-lbl">Exact Time Remaining</div>
        <div class="bento-grid">
            <div class="bento-card"><span class="b-val" id="ex-mo">0</span><span class="b-lbl">Mon</span></div>
            <div class="bento-card"><span class="b-val" id="ex-wk">0</span><span class="b-lbl">Wks</span></div>
            <div class="bento-card"><span class="b-val" id="ex-dy">0</span><span class="b-lbl">Day</span></div>
            <div class="bento-card"><span class="b-val" id="ex-hr">0</span><span class="b-lbl">Hrs</span></div>
            <div class="bento-card"><span class="b-val" id="ex-mn">0</span><span class="b-lbl">Min</span></div>
            <div class="bento-card"><span class="b-val" id="ex-sc">0</span><span class="b-lbl">Sec</span></div>
        </div>
    </div>
    <div class="top-right">
        <div class="section-lbl">Absolute Totals Countdown</div>
        <div class="totals-container">
            <div class="tot-row"><span class="tot-lbl">TOTAL DAYS</span><span class="tot-val" id="tot-days">0</span></div>
            <div class="tot-row"><span class="tot-lbl">TOTAL HOURS</span><span class="tot-val" id="tot-hours">0</span></div>
            <div class="tot-row"><span class="tot-lbl">TOTAL MINS</span><span class="tot-val" id="tot-mins">0</span></div>
            <div class="tot-row"><span class="tot-lbl">TOTAL SECS</span><span class="tot-val" id="tot-secs">0</span></div>
        </div>
    </div>
</div>

<div id="bottom-half"></div>

</div><!-- end app-shell -->

<script>
/* ── THEME OVERLAY SYSTEM ── */
const overlay  = document.getElementById('theme-overlay');
const iconSun  = document.getElementById('icon-sun');
const iconMoon = document.getElementById('icon-moon');
let   toggling = false;

function applyIcons(theme) {
    if (theme === 'dark') {
        iconSun.className  = 'toggle-icon visible';
        iconMoon.className = 'toggle-icon hidden';
    } else {
        iconMoon.className = 'toggle-icon visible';
        iconSun.className  = 'toggle-icon hidden';
    }
}

// Set icons instantly on load
applyIcons(document.documentElement.getAttribute('data-theme'));

function toggleTheme() {
    if (toggling) return; // prevent double-tap
    toggling = true;

    const cur  = document.documentElement.getAttribute('data-theme');
    const next = cur === 'dark' ? 'light' : 'dark';

    // Step 1: Fade overlay IN (current color → covers screen)
    overlay.style.background = getComputedStyle(document.documentElement)
        .getPropertyValue(cur === 'dark' ? '--bg' : '--bg').trim() || (cur === 'dark' ? '#020203' : '#eef1f5');
    overlay.style.background = cur === 'dark' ? '#020203' : '#eef1f5';
    overlay.style.opacity = '1';

    // Step 2: While covered, switch theme instantly (zero visible lag)
    setTimeout(() => {
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        applyIcons(next);

        // Step 3: Fade overlay OUT (reveals new theme underneath)
        // Small delay so browser paints new theme before fade-out
        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                overlay.style.opacity = '0';
                setTimeout(() => { toggling = false; }, 240);
            });
        });
    }, 180);
}

/* ── TARGET DATE ── */
function getTarget() {
    const now = new Date();
    let t = new Date(now.getFullYear(), 6, 18, 23, 59, 59);
    if (now > t) t.setFullYear(t.getFullYear() + 1);
    return t;
}

/* ── CACHED DOM REFS ── */
const elMo = document.getElementById('ex-mo');
const elWk = document.getElementById('ex-wk');
const elDy = document.getElementById('ex-dy');
const elHr = document.getElementById('ex-hr');
const elMn = document.getElementById('ex-mn');
const elSc = document.getElementById('ex-sc');
const elTD = document.getElementById('tot-days');
const elTH = document.getElementById('tot-hours');
const elTM = document.getElementById('tot-mins');
const elTS = document.getElementById('tot-secs');

/* Only write DOM when value changes — prevents unnecessary repaints */
function setVal(el, val) {
    const s = String(val);
    if (el.textContent !== s) {
        el.textContent = s;
        el.classList.remove('tick');
        void el.offsetWidth; // minimal reflow to restart animation
        el.classList.add('tick');
    }
}

/* ── TIMER ── */
function updateTimers() {
    const now    = new Date();
    const target = getTarget();
    const diff   = target - now;
    if (diff <= 0) return;

    elTD.textContent = Math.floor(diff / 86400000).toLocaleString();
    elTH.textContent = Math.floor(diff / 3600000).toLocaleString();
    elTM.textContent = Math.floor(diff / 60000).toLocaleString();
    elTS.textContent = Math.floor(diff / 1000).toLocaleString();

    let check = new Date(now), months = 0;
    while (true) {
        const nm = new Date(check);
        nm.setMonth(nm.getMonth() + 1);
        if (nm <= target) { months++; check = nm; } else break;
    }
    const remDays = Math.floor((target - check) / 86400000);

    setVal(elMo, months);
    setVal(elWk, Math.floor(remDays / 7));
    setVal(elDy, remDays % 7);
    setVal(elHr, Math.floor((diff / 3600000) % 24));
    setVal(elMn, Math.floor((diff / 60000) % 60));
    setVal(elSc, Math.floor((diff / 1000) % 60));
}

/* ── CALENDAR ── */
function buildCalendar() {
    const container  = document.getElementById('bottom-half');
    const frag       = document.createDocumentFragment();
    const now        = new Date();
    const todayMid   = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const targetFull = getTarget();
    const targetMid  = new Date(targetFull.getFullYear(), targetFull.getMonth(), targetFull.getDate());
    let   iter       = new Date(now.getFullYear(), now.getMonth(), 1);

    while (iter <= targetMid) {
        const mb    = document.createElement('div');
        mb.className = 'month-block';

        const title = document.createElement('div');
        title.className = 'month-title';
        title.textContent = iter.toLocaleString('default', { month: 'long', year: 'numeric' });
        mb.appendChild(title);

        const grid = document.createElement('div');
        grid.className = 'calendar-grid';

        'SMTWTFS'.split('').forEach(d => {
            const h = document.createElement('div');
            h.className = 'day-header';
            h.textContent = d;
            grid.appendChild(h);
        });

        const firstDay    = new Date(iter.getFullYear(), iter.getMonth(), 1).getDay();
        const daysInMonth = new Date(iter.getFullYear(), iter.getMonth() + 1, 0).getDate();
        for (let i = 0; i < firstDay; i++) grid.appendChild(document.createElement('div'));

        let done = false;
        for (let i = 1; i <= daysInMonth && !done; i++) {
            const d    = new Date(iter.getFullYear(), iter.getMonth(), i);
            const left = Math.round((targetMid - d) / 86400000);
            const cell = document.createElement('div');
            cell.className = 'day';

            const ds = document.createElement('span');
            ds.className = 'cal-date';
            ds.textContent = i;

            const ls = document.createElement('span');
            ls.className = 'cal-left';

            if (d.getTime() === targetMid.getTime()) {
                cell.classList.add('target');
                ls.textContent = '0';
                cell.appendChild(ds); cell.appendChild(ls);
                grid.appendChild(cell);
                done = true;
            } else {
                ls.textContent = left;
                if      (d < todayMid)                           cell.classList.add('crossed');
                else if (d.getTime() === todayMid.getTime())     cell.classList.add('today');
                cell.appendChild(ds); cell.appendChild(ls);
                grid.appendChild(cell);
            }
        }

        mb.appendChild(grid);
        frag.appendChild(mb);

        if (iter.getMonth()    === targetMid.getMonth() &&
            iter.getFullYear() === targetMid.getFullYear()) break;
        iter.setMonth(iter.getMonth() + 1);
    }

    container.innerHTML = '';
    container.appendChild(frag);

    requestAnimationFrame(() => {
        const todayEl = container.querySelector('.today');
        if (todayEl) todayEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
}

/* ── INIT ── */
updateTimers();
buildCalendar();

// Clock-aligned ticker — no drift
function scheduleNext() {
    const wait = 1000 - new Date().getMilliseconds();
    setTimeout(() => { updateTimers(); scheduleNext(); }, wait);
}
scheduleNext();

// Midnight calendar rebuild
setInterval(() => {
    const n = new Date();
    if (n.getHours()===0 && n.getMinutes()===0 && n.getSeconds()===0) buildCalendar();
}, 1000);
</script>
</body>
</html>
